name: Build All Platforms

on:
  push:
    branches: [main, 'build/*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            msvc-arch: x64
            rust-target: x86_64-pc-windows-msvc
            name: Windows x64
            os: windows-latest
            artifact-name: smailwolf-m3pro-windows-x64
          - platform: windows
            arch: x86
            msvc-arch: x86
            rust-target: i686-pc-windows-msvc
            name: Windows x32 (x86)
            os: windows-latest
            artifact-name: smailwolf-m3pro-windows-x86
          - platform: macos
            arch: arm64
            rust-target: aarch64-apple-darwin
            name: macOS arm64 (Apple Silicon)
            os: macos-latest
            artifact-name: smailwolf-m3pro-macos-arm64
          - platform: macos
            arch: x64
            rust-target: x86_64-apple-darwin
            name: macOS x64 (Intel)
            os: macos-latest
            artifact-name: smailwolf-m3pro-macos-x64
          - platform: linux
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
            name: Linux x64
            os: ubuntu-22.04
            artifact-name: smailwolf-m3pro-linux-x64
          - platform: linux
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
            name: Linux arm64
            os: ubuntu-24.04-arm
            artifact-name: smailwolf-m3pro-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment (${{ matrix.msvc-arch }})
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Ensure NASM & CMake for aws-lc-sys on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            cmake \
            curl \
            wget \
            file \
            rpm \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: HID protocol test gate
        run: npx tsx tests/hid.test.ts

      - name: Setup Rust stable (${{ matrix.rust-target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Tauri CLI sanity check
        run: npx tauri --version

      - name: Cargo check (${{ matrix.rust-target }})
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust-target }}

      # -----------------------------------------------------------------------
      # Build Steps
      # -----------------------------------------------------------------------
      - name: Build Tauri for Windows (${{ matrix.arch }} — NSIS & MSI)
        if: matrix.platform == 'windows'
        run: npx tauri build --target ${{ matrix.rust-target }} --bundles nsis,msi

      - name: Build Tauri for Linux (${{ matrix.arch }} — AppImage, DEB, RPM)
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npx tauri build --target ${{ matrix.rust-target }} --bundles appimage,deb,rpm

      - name: Generate native Apple ICNS icon
        if: matrix.platform == 'macos'
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     src-tauri/icons/icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     src-tauri/icons/icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     src-tauri/icons/icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     src-tauri/icons/icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   src-tauri/icons/icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   src-tauri/icons/icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   src-tauri/icons/icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   src-tauri/icons/icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   src-tauri/icons/icon.png --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 src-tauri/icons/icon.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o src-tauri/icons/icon.icns
          rm -rf AppIcon.iconset

      - name: Build Tauri for macOS (${{ matrix.arch }} — DMG & APP)
        if: matrix.platform == 'macos'
        run: npx tauri build --target ${{ matrix.rust-target }} --bundles dmg,app

      # -----------------------------------------------------------------------
      # Packaging & SHA-256 Checksums
      # -----------------------------------------------------------------------
      - name: Collect Windows artifacts (${{ matrix.arch }})
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $arch = '${{ matrix.arch }}'
          $targetDir = "src-tauri/target/${{ matrix.rust-target }}/release"
          New-Item -ItemType Directory -Force release-artifacts | Out-Null

          $setup = Get-ChildItem "$targetDir/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found under $targetDir/bundle/nsis/" }
          Copy-Item $setup.FullName "release-artifacts/SMAILWOLF-M3-Pro-Driver_${version}_${arch}-setup.exe"

          $msi = Get-ChildItem "$targetDir/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw "MSI installer not found under $targetDir/bundle/msi/" }
          Copy-Item $msi.FullName "release-artifacts/SMAILWOLF-M3-Pro-Driver_${version}_${arch}.msi"

          $exe = Get-ChildItem "$targetDir/smailwolf-m3-pro-driver.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem "$targetDir/*.exe" -Exclude "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { throw "App exe not found under $targetDir/" }
          Compress-Archive -Path $exe.FullName -DestinationPath "release-artifacts/SMAILWOLF-M3-Pro-Driver_${version}_${arch}.zip" -Force

          Get-ChildItem release-artifacts -File | Select-Object Name, Length

      - name: Collect Linux artifacts (${{ matrix.arch }})
        if: matrix.platform == 'linux'
        run: |
          set -e
          mkdir -p release-artifacts
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH="${{ matrix.arch }}"
          TDIR="src-tauri/target/${{ matrix.rust-target }}/release"

          APPIMAGE=$(find "$TDIR/bundle/appimage" -type f -name "*.[aA]pp[iI]mage" | head -n 1)
          [ -n "$APPIMAGE" ] && cp "$APPIMAGE" "release-artifacts/SMAILWOLF-M3-Pro-Driver_${VERSION}-linux-${ARCH}.AppImage"

          DEB=$(find "$TDIR/bundle/deb" -type f -name "*.deb" | head -n 1)
          [ -n "$DEB" ] && cp "$DEB" "release-artifacts/SMAILWOLF-M3-Pro-Driver_${VERSION}-linux-${ARCH}.deb"

          RPM=$(find "$TDIR/bundle/rpm" -type f -name "*.rpm" | head -n 1)
          [ -n "$RPM" ] && cp "$RPM" "release-artifacts/SMAILWOLF-M3-Pro-Driver_${VERSION}-linux-${ARCH}.rpm"

          BIN="$TDIR/smailwolf-m3-pro-driver"
          if [ -f "$BIN" ]; then
            STAGE="portable-stage/SMAILWOLF-M3-Pro-Driver_${VERSION}-linux-${ARCH}"
            mkdir -p "$STAGE"
            cp "$BIN" "$STAGE/"
            cp src-tauri/icons/128x128.png "$STAGE/icon.png"
            cp LICENSE "$STAGE/"
            tar -czf "release-artifacts/SMAILWOLF-M3-Pro-Driver_${VERSION}-linux-${ARCH}.tar.gz" -C portable-stage "SMAILWOLF-M3-Pro-Driver_${VERSION}-linux-${ARCH}"
          fi
          ls -lh release-artifacts/

      - name: Collect macOS artifacts (${{ matrix.arch }})
        if: matrix.platform == 'macos'
        run: |
          set -e
          mkdir -p release-artifacts
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH="${{ matrix.arch }}"
          TDIR="src-tauri/target/${{ matrix.rust-target }}/release"

          DMG=$(find "$TDIR/bundle/dmg" -type f -name "*.dmg" | head -n 1)
          if [ -z "$DMG" ]; then echo "Error: DMG not found"; exit 1; fi
          cp "$DMG" "release-artifacts/SMAILWOLF-M3-Pro-Driver_${VERSION}-macos-${ARCH}.dmg"

          APP=$(find "$TDIR/bundle/macos" -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP" ]; then echo "Error: .app not found"; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-artifacts/SMAILWOLF-M3-Pro-Driver_${VERSION}-macos-${ARCH}.app.zip"
          APP_DIR=$(dirname "$APP")
          APP_NAME=$(basename "$APP")
          tar -czf "release-artifacts/SMAILWOLF-M3-Pro-Driver_${VERSION}-macos-${ARCH}.app.tar.gz" -C "$APP_DIR" "$APP_NAME"
          ls -lh release-artifacts/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release-artifacts/
          if-no-files-found: error

  bundle-all:
    name: Combine All Platforms & Generate Master Checksums
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize release bundle & compute global SHA-256
        run: |
          mkdir -p release-bundle
          find all-artifacts -type f ! -name "SHA256SUMS.txt" -exec cp {} release-bundle/ \;
          cd release-bundle
          LC_ALL=C sha256sum $(ls -1 | sort) > SHA256SUMS.txt
          echo "=========================================="
          echo "   Master SHA-256 Checksums (All OS)      "
          echo "=========================================="
          cat SHA256SUMS.txt

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: smailwolf-m3pro-all-platforms
          path: release-bundle/
          if-no-files-found: error
